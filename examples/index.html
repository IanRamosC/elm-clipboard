<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>elm-clipboard examples</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; color: #1d2433; }
      section { border: 1px solid #d6dbe4; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
      h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
      pre { background: #f3f5f9; padding: .5rem .75rem; border-radius: 6px; overflow-x: auto; }
      elm-clipboard-copy, button { display: inline-block; cursor: pointer; padding: .35rem .8rem; border: 1px solid #8a94a6; border-radius: 6px; background: #fff; font: inherit; }
      elm-clipboard-copy:focus-visible, button:focus-visible { outline: 2px solid #3060d0; outline-offset: 2px; }
      elm-clipboard-copy[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
      elm-clipboard-paste { display: block; border: 2px dashed #8a94a6; border-radius: 8px; padding: 1rem; }
      elm-clipboard-paste:focus { outline: 2px solid #3060d0; }
      textarea { width: 100%; min-height: 4rem; font: inherit; }
      .status { color: #4b5568; font-size: .9rem; margin-left: .5rem; }
      img { max-width: 100%; border: 1px solid #d6dbe4; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="elm-clipboard.js"></script>
    <script src="elm.js"></script>
    <script>
      const app = Elm.Main.init({ node: document.getElementById("app") });
      ElmClipboard.register(app.ports.clipboardOut, app.ports.clipboardIn);
    </script>
  </body>
</html>
